workflows:
  android-debug:
    name: Android Debug (test build)
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        # Pass through the same --dart-define values used locally (see
        # .env.example). Leave GROQ_API_KEY unset for a build-only test —
        # the app builds and runs fine without it, AI chat just stays
        # gated behind consent + a working proxy URL.
        GROQ_API_KEY: $GROQ_API_KEY
        ADS_REMOTE_CONFIG_URL: $ADS_REMOTE_CONFIG_URL
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build debug APK
        script: |
          flutter build apk --debug \
            --dart-define=GROQ_API_KEY=$GROQ_API_KEY \
            --dart-define=ADS_REMOTE_CONFIG_URL=$ADS_REMOTE_CONFIG_URL
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - ayoubboutglay318@gmail.com
        notify:
          success: true
          failure: true

  ios-simulator-debug:
    name: iOS Simulator Debug (test build, no signing needed)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        GROQ_API_KEY: $GROQ_API_KEY
        ADS_REMOTE_CONFIG_URL: $ADS_REMOTE_CONFIG_URL
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          find . -maxdepth 2 -name "Podfile" -execdir pod install \;
      - name: Build for iOS Simulator
        script: |
          flutter build ios --debug --simulator \
            --dart-define=GROQ_API_KEY=$GROQ_API_KEY \
            --dart-define=ADS_REMOTE_CONFIG_URL=$ADS_REMOTE_CONFIG_URL
    artifacts:
      - build/ios/iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - ayoubboutglay318@gmail.com
        notify:
          success: true
          failure: true

  # App Store / TestFlight build — signed for app_store distribution and
  # auto-uploaded to App Store Connect on success.
  # PREREQUISITE — not usable as-is until you set this up in Codemagic:
  #   Team settings > Integrations > App Store Connect: add an API key
  #   from your Apple Developer account (App Store Connect > Users and
  #   Access > Keys > Integrations, role "App Manager" or higher).
  #   Codemagic then fetches/creates the certificate and provisioning
  #   profile automatically at build time (no need to upload them
  #   yourself), and uses the same key to push the build to App Store
  #   Connect. Until that's configured, this workflow will fail — use
  #   ios-simulator-debug above to just test the Flutter/Dart side.
  ios-app-store:
    name: iOS App Store Build (needs App Store Connect key set up in Codemagic)
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.meratun.app
        GROQ_API_KEY: $GROQ_API_KEY
        ADS_REMOTE_CONFIG_URL: $ADS_REMOTE_CONFIG_URL
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          find . -maxdepth 2 -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Use signing files
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=GROQ_API_KEY=$GROQ_API_KEY \
            --dart-define=ADS_REMOTE_CONFIG_URL=$ADS_REMOTE_CONFIG_URL
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - ayoubboutglay318@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Only pushes to TestFlight, not for App Store review — flip this
        # on once you're ready to actually submit for review.
        submit_to_app_store: false
