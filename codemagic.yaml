workflows:
  android-debug:
    name: Android Debug (test build)
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        # Pass through the same --dart-define values used locally (see
        # .env.example). Leave GROQ_API_KEY unset for a build-only test —
        # the app builds and runs fine without it, AI chat just stays
        # gated behind consent + a working proxy URL.
        GROQ_API_KEY: $GROQ_API_KEY
        ADS_REMOTE_CONFIG_URL: $ADS_REMOTE_CONFIG_URL
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build debug APK
        script: |
          flutter build apk --debug \
            --dart-define=GROQ_API_KEY=$GROQ_API_KEY \
            --dart-define=ADS_REMOTE_CONFIG_URL=$ADS_REMOTE_CONFIG_URL
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - abdelhaqouballouk0@gmail.com
        notify:
          success: true
          failure: true

  ios-simulator-debug:
    name: iOS Simulator Debug (test build, no signing needed)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        GROQ_API_KEY: $GROQ_API_KEY
        ADS_REMOTE_CONFIG_URL: $ADS_REMOTE_CONFIG_URL
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          find . -maxdepth 2 -name "Podfile" -execdir pod install \;
      - name: Build for iOS Simulator
        script: |
          flutter build ios --debug --simulator \
            --dart-define=GROQ_API_KEY=$GROQ_API_KEY \
            --dart-define=ADS_REMOTE_CONFIG_URL=$ADS_REMOTE_CONFIG_URL
    artifacts:
      - build/ios/iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - abdelhaqouballouk0@gmail.com
        notify:
          success: true
          failure: true

  # App Store / TestFlight build — signed for app_store distribution and
  # auto-uploaded to App Store Connect on success.
  # PREREQUISITE — not usable as-is until you set this up in Codemagic:
  #   1. Team settings > Code Signing Identities > iOS Certificates:
  #      upload your Apple Distribution certificate (.p12 + password).
  #   2. Team settings > Code Signing Identities > iOS Provisioning
  #      Profiles: upload a matching "App Store" provisioning profile
  #      for bundle_identifier below, generated with that same certificate.
  #   3. Team settings > Integrations > App Store Connect: add an API key
  #      (App Store Connect > Users and Access > Integrations, role
  #      "Admin") — only used to publish the built IPA to TestFlight, not
  #      for signing.
  #   Codemagic then matches the uploaded certificate + profile against
  #   ios_signing below automatically; it does NOT auto-generate them —
  #   see ios-simulator-debug above if you just want to test the
  #   Flutter/Dart side without setting any of this up.
  ios-app-store:
    name: iOS App Store Build (needs signing identities uploaded in Codemagic)
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meratun.app
      vars:
        GROQ_API_KEY: $GROQ_API_KEY
        ADS_REMOTE_CONFIG_URL: $ADS_REMOTE_CONFIG_URL
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          find . -maxdepth 2 -name "Podfile" -execdir pod install \;
      - name: Apply signing files to the Xcode project
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=GROQ_API_KEY=$GROQ_API_KEY \
            --dart-define=ADS_REMOTE_CONFIG_URL=$ADS_REMOTE_CONFIG_URL
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - abdelhaqouballouk0@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Only pushes to TestFlight, not for App Store review — flip this
        # on once you're ready to actually submit for review.
        submit_to_app_store: false
